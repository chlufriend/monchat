
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mon Chat - Real-Time Chat</title>

    <!-- Socket.IO client library -->
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }

        #messages {
            height: 350px;
            overflow-y: auto;
            list-style: none;
            padding: 12px;
            margin: 15px 0;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
        }

        #messages li {
            background: #dbeafe;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow-wrap: anywhere;
        }

        #chat-form {
            display: flex;
            gap: 8px;
        }

        #message {
            flex: 1;
            min-width: 0;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .status {
            text-align: center;
            font-size: 14px;
            color: #64748b;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <h1>💬 Mon Chat</h1>
        <p class="subtitle">Welcome to our real-time chat room!</p>

        <!-- Enter your nickname -->
        <label for="name">Your nickname</label>
        <input
            id="name"
            type="text"
            placeholder="Enter your nickname"
            maxlength="20"
        >

        <!-- Chat messages appear here -->
        <ul id="messages" aria-live="polite"></ul>

        <!-- Send a message -->
        <form id="chat-form">
            <input
                id="message"
                type="text"
                placeholder="Type your message..."
                maxlength="500"
                autocomplete="off"
                required
            >
            <button type="submit">Send</button>
        </form>

        <p class="status" id="status">Connecting...</p>
    </div>

    <script>
        // Connect to the Flask-SocketIO server
        const socket = io();

        // Find HTML elements
        const form = document.getElementById("chat-form");
        const nameInput = document.getElementById("name");
        const messageInput = document.getElementById("message");
        const messages = document.getElementById("messages");
        const status = document.getElementById("status");

        // Show connection status
        socket.on("connect", function () {
            status.textContent = "Connected to chat!";
        });

        socket.on("disconnect", function () {
            status.textContent = "Disconnected. Reconnecting...";
        });

        // Send a message when the form is submitted
        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = nameInput.value.trim() || "Student";
            const message = messageInput.value.trim();

            if (message === "") {
                return;
            }

            socket.emit("chat_message", {
                name: name,
                message: message
            });

            messageInput.value = "";
            messageInput.focus();
        });

        // Receive messages from the server
        socket.on("chat_message", function (data) {
            const item = document.createElement("li");

            // Use textContent to display text safely
            item.textContent = data.name + ": " + data.message;

            messages.appendChild(item);

            // Automatically scroll to the latest message
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
